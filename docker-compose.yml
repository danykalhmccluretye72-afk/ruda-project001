services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockyard
      POSTGRES_USER: stockyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
      TZ: Asia/Vladivostok
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/auth.sql:/docker-entrypoint-initdb.d/02-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockyard -d stockyard"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://stockyard:${POSTGRES_PASSWORD}@db:5432/stockyard}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Задайте BETTER_AUTH_SECRET в файле .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Задайте BETTER_AUTH_URL в файле .env}
      TZ: Asia/Vladivostok
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
